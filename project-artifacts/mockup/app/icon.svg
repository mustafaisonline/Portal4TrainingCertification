<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Favicon. The PublicShell LogoMark is drawn as a hairline outline, which
       disappears at 16px — so this is the same mark rebuilt for small sizes:
       solid indigo ground, white strokes, heavier weights. Same idea (a
       capability line rising through data nodes), legible in a browser tab. -->
  <rect width="32" height="32" rx="8" fill="#3d43b8"/>
  <path d="M8 22.5 L14 15 L18 18 L24 9"
        fill="none" stroke="#ffffff" stroke-width="2.6"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="24" cy="9" r="3.1" fill="#ffffff"/>
  <circle cx="8" cy="22.5" r="2.2" fill="#ffffff" fill-opacity="0.6"/>
</svg>

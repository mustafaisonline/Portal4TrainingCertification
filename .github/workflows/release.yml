# Release — build, PROVE and package a release artifact for a tag.
# (MILESTONE_11_EXECUTION_PLAN.md §2 item 3; decision K6, reversed 2026-09-27
# — ARCHITECTURE_DECISION_REGISTER.md ADR-046 K2/K6/K9 supersession: the
# release is still built and proven only here, never on a laptop or on the
# server, but shipped as a GitHub Actions artifact instead of a Docker image
# — there is no registry anywhere in this framework any more.)
#
#   git tag v2026.10.03 && git push origin v2026.10.03
#
# 1. verify    — the whole CI gate (ci.yml via workflow_call) on the tagged commit
# 2. artifact  — npm ci, prisma generate, next build, then PROVE the exact
#                built output against a throwaway PostgreSQL: migrations
#                apply cleanly, `next start` answers /api/health 200 with
#                db:up and the newest migration, the webhook refuses an
#                unsigned POST (400), X-Frame-Options is set. Only then is
#                the release packaged (.next, public, package.json/lock,
#                next.config.ts, prisma schema+migrations, the pre-generated
#                Prisma client) and uploaded as a GitHub Actions artifact
#                named p4tc-release-<tag>.
#
# Nothing here deploys: the server only receives a release through
# deploy/start.sh, which downloads this exact artifact via `gh run download`.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  artifact:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: p4tc
          POSTGRES_PASSWORD: p4tc
          POSTGRES_DB: p4tc_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U p4tc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Resolve the release tag
        # A tag push → the tag itself. A manual run on a branch → "branch-<name>"
        # with "/" replaced (a valid artifact name) — proven, never fetchable
        # by deploy/05-deploy.sh (which only ever asks for a v* tag).
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then tag="${GITHUB_REF_NAME}"; else tag="branch-$(printf '%s' "${GITHUB_REF_NAME}" | tr '/' '-')"; fi
          echo "TAG=$tag" >> "$GITHUB_ENV"; echo "release tag: $tag"

      - name: Install dependencies (exact lockfile)
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Build
        # BETTER_AUTH_SECRET is a throwaway build-time value for the same
        # reason the former Dockerfile needed one: src/modules/identity/
        # auth.ts constructs betterAuth({ secret: requiredEnv(...) }) at
        # module-load time, and Next's build imports every route module
        # (even force-dynamic ones) to collect its config. This value is
        # never the one the deployed process uses — run.sh sources the real,
        # root-owned production.env fresh when the server starts `next
        # start`, exactly as `next start` already re-executes the module
        # fresh in the current Docker-based setup.
        env:
          DATABASE_URL: postgresql://p4tc:p4tc@localhost:5432/p4tc_ci
          BETTER_AUTH_SECRET: build-time-placeholder-not-used-at-runtime
        run: npm run build

      - name: Set the database timezone to UTC (as production must)
        run: psql postgresql://p4tc:p4tc@localhost:5432/p4tc_ci -v ON_ERROR_STOP=1 -c "ALTER DATABASE p4tc_ci SET timezone TO 'UTC';"

      - name: Prove the migrations (prisma migrate deploy + status)
        env:
          DATABASE_URL: postgresql://p4tc:p4tc@localhost:5432/p4tc_ci
        run: |
          npx prisma migrate deploy
          npx prisma migrate status | tee status.txt
          grep -q "Database schema is up to date" status.txt

      - name: Prove the build (starts in production mode, /api/health 200)
        # CI-only values, same as the runtime env block the Docker-based
        # workflow used to pass to `docker run`. NODE_ENV=production makes
        # instrumentation.ts refuse to start on any missing/malformed
        # variable — which is the point: the exact artifact that gets
        # packaged below must come up under the same rule the server applies.
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://p4tc:p4tc@localhost:5432/p4tc_ci
          APP_BASE_URL: https://ci.invalid
          BETTER_AUTH_SECRET: ci-only-secret-not-for-any-real-environment-0123456789
          PROFILE_ENCRYPTION_KEY: KioqKioqKioqKioqKioqKioqKioqKioqKioqKioqKio=
          EMAIL_TRANSPORT: log
          JOBS_SECRET: ci-only-jobs-secret-0123456789
          STRIPE_SECRET_KEY: rk_test_ci_only_not_a_real_key
          STRIPE_WEBHOOK_SECRET: whsec_ci_only_not_a_real_secret
        run: |
          node_modules/.bin/next start -p 3000 &
          echo $! > next.pid
          for i in $(seq 1 30); do
            body="$(curl -s http://127.0.0.1:3000/api/health || true)"
            if printf '%s' "$body" | grep -q '"db":"up"'; then echo "$body"; break; fi
            sleep 2
          done
          printf '%s' "$body" | grep -q '"status":"ok"' || { echo "--- next start output ---"; kill "$(cat next.pid)" 2>/dev/null || true; exit 1; }
          newest="$(ls -1 prisma/migrations | grep -E '^[0-9]{14}_' | sort | tail -1)"
          printf '%s' "$body" | grep -q "\"migration\":\"$newest\"" || { echo "health reports a different migration than $newest"; kill "$(cat next.pid)" 2>/dev/null || true; exit 1; }
          code="$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:3000/api/stripe/webhook)"
          [ "$code" = "400" ] || { echo "unsigned webhook POST returned $code, expected 400"; kill "$(cat next.pid)" 2>/dev/null || true; exit 1; }
          curl -sI http://127.0.0.1:3000/ | grep -qi 'x-frame-options: deny' || { echo "X-Frame-Options: DENY missing"; kill "$(cat next.pid)" 2>/dev/null || true; exit 1; }
          kill "$(cat next.pid)" 2>/dev/null || true

      - name: Package the release
        # Exactly the files the server needs to run `npm ci && ./run.sh`
        # from (deploy/lib/server-promote.sh's unpack_release()) — the same
        # set the former Dockerfile's runtime stage COPYed, minus node_modules
        # (the server installs its own from package-lock.json). `.next/cache`
        # is excluded: it is `next build`'s OWN incremental-build cache (found
        # ~136 MB locally), read only by a future `next build`, never by
        # `next start` — unpack_release() creates a fresh, deploy-writable
        # `.next/cache` for next/image's runtime cache instead.
        run: |
          rm -rf release && mkdir -p release
          cp -r .next release/.next && rm -rf release/.next/cache
          cp -r public release/public
          cp package.json package-lock.json next.config.ts prisma.config.ts release/
          # The full prisma/ and src/ trees (not just schema+migrations and
          # src/generated) — found missing 2026-09-28 running the first real
          # `db:seed`/`learning:import`/`admin:grant` against production:
          # those are one-off OPERATOR commands (Node 24 runs the .ts files
          # directly, no separate build step), so the release has to carry
          # their raw source too, not just the compiled .next output. This
          # is what the old Docker `migrate` image already did (FROM build,
          # the full source) — this brings the rsync+PM2 release to parity.
          cp -r prisma release/prisma
          cp -r src release/src
          cp -r scripts release/scripts
          tar -czf "p4tc-release-${TAG}.tar.gz" -C release .
          echo "packaged $(du -h "p4tc-release-${TAG}.tar.gz" | cut -f1)"

      - name: Upload the release artifact
        uses: actions/upload-artifact@v4
        with:
          name: p4tc-release-${{ env.TAG }}
          path: p4tc-release-${{ env.TAG }}.tar.gz
          retention-days: 90
          if-no-files-found: error
